<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Evaluation Report</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; color: #1f2937; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    .summary { display: flex; gap: 16px; margin: 16px 0; }
    .metric { border: 1px solid #d1d5db; padding: 12px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Skill Evaluation Report</h1>
  <div class="summary">
    <div class="metric"><strong>Total</strong><br>{{TOTAL}}</div>
    <div class="metric"><strong>Average Score</strong><br>{{AVERAGE_SCORE}}</div>
  </div>
  {{ROWS}}
</body>
</html>
